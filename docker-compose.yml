version: '3.8'

services:
# Add this service block to your existing docker-compose.yml

  zap:
    image: owasp/zap2docker-stable
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
    networks:
      - scan_worker_net   # internal network only — do NOT expose this port publicly

# And make sure your existing worker service is on the same internal network:
#
#   worker:
#     ...
#     networks:
#       - scan_worker_net
#
# networks:
#   scan_worker_net:
#     internal: true

  db:
    image: postgres:16-alpine
    container_name: cyberguardian_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cyberguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cyberguardian_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguardian_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/cyberguardian
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkeycyberguardianai123!
      - ENVIRONMENT=development
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguardian_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/cyberguardian
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkeycyberguardianai123!
      - ENVIRONMENT=development
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguardian_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
